name: Bug report
description: Report something that is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. See [CONTRIBUTING.md](../../CONTRIBUTING.md) for setup and PR guidelines.
        For security issues, use [private vulnerability reporting](https://github.com/noamarg/WorkCrate/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: backend / frontend / scripts / docs
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, Node version, commit or branch.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output (redact secrets).
