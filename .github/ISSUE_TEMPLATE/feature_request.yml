name: Feature request
description: Suggest a product or technical improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Product changes should align with [use cases](https://github.com/noamarg/WorkCrate/blob/main/docs/usecases/README.md) when possible (link an `SCN-*` or MOD).
        See [CONTRIBUTING.md](../../CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: scn
    attributes:
      label: Related SCN or MOD
      placeholder: e.g. SCN-WORK-001, MOD-05
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
